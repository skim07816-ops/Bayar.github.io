<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tagihan Pembayaran QRIS</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
        .card { background: #ffffff; padding: 24px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 360px; text-align: center; }
        .logo { background: #0061A4; color: white; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin: 0 auto 12px; font-size: 18px; }
        .amount { font-size: 26px; font-weight: 800; color: #0061A4; margin: 6px 0 12px; }
        .badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 11px; letter-spacing: 0.5px; }
        .pending { background: #FFF8E1; color: #795548; border: 1px solid #FFD54F; }
        .paid { background: #E8F5E9; color: #2E7D32; border: 1px solid #A5D6A7; }
        .expired { background: #FFEBEE; color: #C62828; border: 1px solid #EF9A9A; }
        .info { font-size: 11px; color: #6b7280; margin-top: 8px; }
        .qris-box { background: #F9FAFB; padding: 12px; border-radius: 12px; border: 1px solid #E5E7EB; margin: 16px 0; display: inline-block; }
        .qris-box img { width: 180px; height: 180px; display: block; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">SB</div>
    <h3 style="margin: 4px 0; font-size: 16px; color: #1B1B1F;">Tagihan SairiBot Kasir</h3>
    
    <div class="info">Nominal Pembayaran:</div>
    <div class="amount" id="nominal">Rp 0</div>

    <div class="qris-box" id="qris-container" style="display: none;">
        <img id="qris-img" src="" alt="QRIS Code">
    </div>

    <div class="info">ID Transaksi: <br><strong id="invoice-id" style="color: #374151;">-</strong></div>

    <div style="margin-top: 12px;">
        <div id="status-badge" class="badge pending">MENUNGGU PEMBAYARAN</div>
    </div>

    <p style="font-size: 11px; color: #9ca3af; margin-top: 20px; line-height: 1.4;">
        Scan QRIS di atas atau bayar sesuai nominal di M-Banking / E-Wallet Anda. Status akan diperbarui otomatis.
    </p>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const invId = urlParams.get('inv');
    const total = urlParams.get('total');
    const qrisData = urlParams.get('qris');

    if (invId && total) {
        document.getElementById('nominal').innerText = `Rp ${parseInt(total).toLocaleString('id-ID')}`;
        document.getElementById('invoice-id').innerText = invId;

        if (qrisData) {
            const qrisImg = document.getElementById('qris-img');
            qrisImg.src = qrisData.startsWith('data:') ? qrisData : 'data:image/png;base64,' + qrisData;
            document.getElementById('qris-container').style.display = 'inline-block';
        }

        function checkStatus() {
            fetch(`https://api.sairibot.my.id/api/invoice/status?apikey=SKY_be1b80ec1d164337&invoice_id=${invId}`)
                .then(res => res.json())
                .then(data => {
                    const badge = document.getElementById('status-badge');
                    if (data.status) {
                        const status = data.status.toLowerCase();
                        if (status === 'paid') {
                            badge.innerText = 'PEMBAYARAN BERHASIL';
                            badge.className = 'badge paid';
                        } else if (status === 'expired') {
                            badge.innerText = 'TRANSAKSI KEDALUWARSA';
                            badge.className = 'badge expired';
                        }
                    }
                })
                .catch(() => {});
        }

        checkStatus();
        setInterval(checkStatus, 4000);
    }
</script>

</body>
</html>
